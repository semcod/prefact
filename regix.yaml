regix:
  workdir: .

  # ── Quality gates ──────────────────────────────────────────
  # Hard gates follow the repo's declared standards:
  #   cc_max: 15, coverage_min: 40  (pyqual.yaml metrics; coverage ~43% now)
  # Regix adds the DELTA view (CC/MI/coverage between refs) on top.
  gates:
    # Hard — violations block the pipeline (exit code 1)
    hard:
      cc: 15
      mi: 20
      coverage: 40
      length: 100
      docstring: 0        # not gated (pyqual.yaml has no docstring gate)
      quality: 0.85

    # Target — aspirational goals, reported as warnings
    target:
      cc: 10
      mi: 30
      coverage: 60
      length: 50
      docstring: 30
      quality: 0.95

    on_regression: warn
    fail_exit_code: 1

  # ── Delta thresholds (relative change between commits) ─────
  deltas:
    warn: 2
    error: 5

  # ── Backends ───────────────────────────────────────────────
  backends:
    cc: lizard
    mi: radon
    coverage: pytest-cov
    quality: none
    docstring: builtin
    # mi_granularity: module   # or "function" — score each function's own
    #                          # span so helper extraction (lower CC, more LOC)
    #                          # stops dropping module MI below the gate

  # ── File filtering ─────────────────────────────────────────
  exclude:
    - "tests/**"
    - "docs/**"
    - "examples/**"
    - ".venv/**"
    - "venv/**"
    - "worktrees/**"
    - "dist/**"
    - "build/**"
    - "refactor_output/**"
    - "logs/**"
    - "vscode-extension/**"
    - "testql-scenarios/**"
    - "test_*.py"
    - "benchmark_*.py"

  # ── Output ─────────────────────────────────────────────────
  output:
    format: rich
    dir: .regix/
    show_improvements: true
